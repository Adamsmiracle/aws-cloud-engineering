AWSTemplateFormatVersion: "2010-09-09"
Description: GitSync-compatible IAM automation lab with users, groups, and a shared temporary password

Resources:

  # ================
  # SECRETS MANAGER
  # ================
  IAMSecretpassword:
    Type: "AWS::SecretsManager::Secret"
    Properties:
      Name: "IAMLabTemporaryPassword"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "iam-users"}'
        GenerateStringKey: "password"
        PasswordLength: 12
        ExcludePunctuation: false
        RequireEachIncludedType: true

  # ===============
  # IAM GROUPS
  # ===============
  EC2FullAccessGroup:
    Type: "AWS::IAM::Group"
    Properties:
      GroupName: "EC2FullAccessGroup"

  EC2ReadOnlyGroup:
    Type: "AWS::IAM::Group"
    Properties:
      GroupName: "EC2ReadOnlyGroup"

  S3Group:
    Type: "AWS::IAM::Group"
    Properties:
      GroupName: "S3Group"

  # ================
  # COMMON POLICIES (Applied to ALL groups)
  # ================
  ChangePasswordPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      ManagedPolicyName: "ChangePasswordPolicy"
      Groups:
        - !Ref EC2FullAccessGroup
        - !Ref EC2ReadOnlyGroup
        - !Ref S3Group
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "iam:ChangePassword"
              - "iam:GetAccountPasswordPolicy"
            Resource: "arn:aws:iam::*:user/${aws:username}"

  # ================
  # SERVICE-SPECIFIC POLICIES
  # ================
  EC2FullAccessPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      ManagedPolicyName: "EC2FullAccessPolicy"
      Groups:
        - !Ref EC2FullAccessGroup
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "ec2:RunInstances"
              - "ec2:Describe*"
            Resource: "*"

  EC2ReadOnlyPolicy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      ManagedPolicyName: "EC2ReadOnlyPolicy"
      Groups:
        - !Ref EC2ReadOnlyGroup
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "ec2:Describe*"
            Resource: "*"

  S3Policy:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      ManagedPolicyName: "S3GroupPolicy"
      Groups:
        - !Ref S3Group
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "s3:ListBucket"
              - "s3:ListAllMyBuckets"
            Resource: "*"

  # ================
  # IAM USERS
  # ================
  EC2User1:
    Type: "AWS::IAM::User"
    DependsOn: IAMSecretpassword
    Properties:
      UserName: "ec2-user1"
      Groups:
        - !Ref EC2FullAccessGroup
      LoginProfile:
        Password: "{{resolve:secretsmanager:IAMLabTemporaryPassword:SecretString:password}}"
        PasswordResetRequired: true

  EC2User2:
    Type: "AWS::IAM::User"
    DependsOn: IAMSecretpassword
    Properties:
      UserName: "ec2-user2"
      Groups:
        - !Ref EC2ReadOnlyGroup
      LoginProfile:
        Password: "{{resolve:secretsmanager:IAMLabTemporaryPassword:SecretString:password}}"
        PasswordResetRequired: true

  S3User:
    Type: "AWS::IAM::User"
    DependsOn: IAMSecretpassword
    Properties:
      UserName: "s3-user"
      Groups:
        - !Ref S3Group
      LoginProfile:
        Password: "{{resolve:secretsmanager:IAMLabTemporaryPassword:SecretString:password}}"
        PasswordResetRequired: true

Outputs:
  SecretArn:
    Description: "ARN of the generated secret password"
    Value: !Ref IAMSecretpassword

  ConsoleLoginURL:
    Description: "AWS Console sign-in URL"
    Value: !Sub "https://${AWS::AccountId}.signin.aws.amazon.com/console"
