AWSTemplateFormatVersion: "2010-09-09"
Description: GitSync-compatible IAM automation lab with users, groups, and a shared temporary password

Resources:

  # ================
  # SECRETS MANAGER
  # ================
  IAMSecretpassword:
    Type: "AWS::SecretsManager::Secret"
    Properties:
      Name: "IAMLabTemporaryPassword"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "iam-users"}'
        GenerateStringKey: "password"
        PasswordLength: 12
        ExcludePunctuation: false
        RequireEachIncludedType: true

  # ===============
  # IAM GROUPS
  # ===============

  EC2Group:
    Type: "AWS::IAM::Group"
    Properties:
      GroupName: "EC2Group"

  S3Group:
    Type: "AWS::IAM::Group"
    Properties:
      GroupName: "S3Group"

  # ================
  # GROUP POLICIES
  # ================

  EC2Policy:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "EC2GroupPolicy"
      Groups:
        - !Ref EC2Group
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "ec2:DescribeInstances"
              - "ec2:RunInstances"
            Resource: "*"
          # ✅ Allow EC2 group users to change their own password
          - Effect: "Allow"
            Action:
              - "iam:ChangePassword"
              - "iam:GetAccountPasswordPolicy"
            Resource: "arn:aws:iam::*:user/${aws:username}"

  S3Policy:
    Type: "AWS::IAM::Policy"
    Properties:
      PolicyName: "S3GroupPolicy"
      Groups:
        - !Ref S3Group
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Action:
              - "s3:ListBucket"
              - "s3:ListAllMyBuckets"
            Resource: "*"
          - Effect: "Allow"
            Action:
              - "iam:ChangePassword"
              - "iam:GetAccountPasswordPolicy"
            Resource: "arn:aws:iam::*:user/${aws:username}"

  # ================
  # IAM USERS
  # ================

  EC2User1:
    Type: "AWS::IAM::User"
    DependsOn: IAMSecretpassword
    Properties:
      UserName: "ec2-user1"
      Groups:
        - !Ref EC2Group
      LoginProfile:
        Password: "{{resolve:secretsmanager:IAMLabTemporaryPassword:SecretString:password}}"
        PasswordResetRequired: true

  EC2User2:
    Type: "AWS::IAM::User"
    DependsOn: IAMSecretpassword
    Properties:
      UserName: "ec2-user2"
      Groups:
        - !Ref EC2Group
      Policies:
        - PolicyName: "EC2User2LaunchPolicy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: "Allow"
                Action:
                  - "ec2:RunInstances"
                  - "ec2:Describe*"
                  - "ec2:CreateTags"
                  - "ec2:DescribeKeyPairs"
                  - "ec2:DescribeImages"
                  - "ec2:DescribeInstances"
                  - "ec2:DescribeSubnets"
                  - "ec2:DescribeSecurityGroups"
                  - "ec2:CreateSecurityGroup"
                  - "ec2:AuthorizeSecurityGroupIngress"
                Resource: "*"
      LoginProfile:
        Password: "{{resolve:secretsmanager:IAMLabTemporaryPassword:SecretString:password}}"
        PasswordResetRequired: true

  S3User:
    Type: "AWS::IAM::User"
    DependsOn: IAMSecretpassword
    Properties:
      UserName: "s3-user"
      Groups:
        - !Ref S3Group
      LoginProfile:
        Password: "{{resolve:secretsmanager:IAMLabTemporaryPassword:SecretString:password}}"
        PasswordResetRequired: true

Outputs:
  SecretArn:
    Description: "ARN of the generated secret password"
    Value: !Ref IAMSecretpassword

  ConsoleLoginURL:
    Description: "AWS Console sign-in URL"
    Value: !Sub "https://${AWS::AccountId}.signin.aws.amazon.com/console"
