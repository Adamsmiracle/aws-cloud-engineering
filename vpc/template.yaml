AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Highly Available Multi-AZ VPC - Web Tier + App Tier With SSM Session manager
  access. All trafiic managed via least-privilege security groups. 


Parameters:
  EnvironmentName:
    Type: String
    Default: ha-vpc-lab

  AmazonLinuxAMI:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI ID

  InstanceType:
    Type: String
    Default: t3.micro
    Description: EC2 instance type for all four instances



# ==========================================================
# RESOURCES
# ==========================================================
Resources:

# ==========================================================
# VPC
# ==========================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-vpc"
  

# ==========================================================
# Internet Gateway
# ==========================================================
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-igw"
    
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  

  # =========================================================
  # SUBNETS - 2 Public, 2 Private
  # =========================================================

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-subnet-a"
  
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-subnet-b"
  
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-subnet-a"
  
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-subnet-b"


  # =========================================================
  # ELASTIC IPS + GATEWAYS (one per Az to prevent cross Az dependency)
  # =========================================================
  EipNatA:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-nat-eip-a"

  EipNatB:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-nat-eip-b"
  
  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EipNatA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-nat-gw-a"
  
  NatGatewayB:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt EipNatB.AllocationId
      SubnetId: !Ref PublicSubnetB
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-nat-gw-b"


  # ==========================================
  # ROUTE TABLES
  # ==========================================
  
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-public-rt"

  PublicDefaultRoutes:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  
  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable


  # Private route table A ( routes through NAT Gateway A AZ A)
  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-rt-a"
  
  
  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTableA


  # Private route table B ( routes through NAT Gateway B AZ B)
  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-private-rt-b"

  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayB

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTableB




  # =========================================================
  # IAM - EC2 Role + Instance Profile for SSM Session Manager
  # =========================================================
  EC2SSmRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ec2-ssm-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-ec2-ssm-role"


  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub "${EnvironmentName}-ec2-instance-profile"
      Roles:
        - !Ref EC2SSmRole



  # =========================================================
  # SECURITY GROUPS
  # =========================================================
  WebTierSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${EnvironmentName}-web-tier-sg"
      GroupDescription: Web tier - HTTP from internet, ICMP from VPC, no SSH
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Allow HTTP from Internet
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          # CidrIp: 10.0.0.0/16
          CidrIp: 0.0.0.0/0
          Description: ICMP ping from within VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all Outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-web-tier-sg"

  # App Tier SG: ICMP from VPC 
  AppTierSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "${EnvironmentName}-app-tier-sg"
      GroupDescription: App tier - ICMP from VPC,
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 10.0.0.0/16
          Description: ICMP ping from within VPC
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-tier-sg"


  # =========================================================
  # EC2 INSTANCES - 2 Web Tier, (Public)
  # =========================================================
  WebInstanceA:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmazonLinuxAMI
      SubnetId: !Ref PublicSubnetA
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref WebTierSG
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf update -y
          dnf install -y httpd
          systemctl enable httpd
          systemctl start httpd
 
          cat > /var/www/html/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <title>HA VPC Lab — Web Server</title>
            <style>
              body { font-family: Arial, sans-serif; background: #f4f6f8;
                     display: flex; justify-content: center; align-items: center;
                     min-height: 100vh; margin: 0; }
              .card { background: white; border-radius: 12px; padding: 40px 50px;
                      box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 480px;
                      text-align: center; }
              h1 { color: #1a73e8; margin-bottom: 8px; }
              .badge { background: #e8f0fe; color: #1a73e8; padding: 4px 12px;
                       border-radius: 20px; font-size: 13px; display: inline-block;
                       margin-bottom: 24px; }
              .info { background: #f8f9fa; border-radius: 8px; padding: 16px;
                      text-align: left; font-size: 14px; line-height: 1.8; }
              .label { font-weight: bold; color: #555; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>&#x1F30D; HA VPC Lab</h1>
              <div class="badge">Web Tier — Public Instance</div>
              <div class="info">
                <div><span class="label">Full Name:</span>Adams Miracle</div>
                <div><span class="label">Lab Name:</span> Highly Available Multi-AZ VPC</div>
                <div><span class="label">Instance:</span> Web-A</div>
                <div><span class="label">Availability Zone:</span> $AZ</div>
                <div><span class="label">Private IP:</span> $LOCAL_IP</div>
              </div>
            </div>
          </body>
          </html>
          EOF
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-web-ec2-a"
        


  WebInstanceB:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmazonLinuxAMI
      SubnetId: !Ref PublicSubnetB
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref WebTierSG
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          dnf update -y
          dnf install -y httpd
          systemctl enable httpd
          systemctl start httpd

          cat > /var/www/html/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <title>HA VPC Lab — Web Server</title>
            <style>
              body { font-family: Arial, sans-serif; background: #f4f6f8;
                     display: flex; justify-content: center; align-items: center;
                     min-height: 100vh; margin: 0; }
              .card { background: white; border-radius: 12px; padding: 40px 50px;
                      box-shadow: 0 4px 20px rgba(0,0,0,0.1); max-width: 480px;
                      text-align: center; }
              h1 { color: #1a73e8; margin-bottom: 8px; }
              .badge { background: #e8f0fe; color: #1a73e8; padding: 4px 12px;
                       border-radius: 20px; font-size: 13px; display: inline-block;
                       margin-bottom: 24px; }
              .info { background: #f8f9fa; border-radius: 8px; padding: 16px;
                      text-align: left; font-size: 14px; line-height: 1.8; }
              .label { font-weight: bold; color: #555; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>&#x1F30D; HA VPC Lab</h1>
              <div class="badge">Web Tier — Public Instance</div>
              <div class="info">
                <div><span class="label">Full Name:</span>Adams Miracle</div>
                <div><span class="label">Lab Name:</span> Highly Available Multi-AZ VPC</div>
                <div><span class="label">Instance:</span> Web-B</div>
                <div><span class="label">Availability Zone:</span> $AZ</div>
                <div><span class="label">Private IP:</span> $LOCAL_IP</div>
              </div>
            </div>
          </body>
          </html>
          EOF
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-web-ec2-b"

  # =========================================================
  # EC2 INSTANCES - App Tier - 2 (Private)
  # ==========================================================

  AppInstanceA:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmazonLinuxAMI
      SubnetId: !Ref PrivateSubnetA
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref AppTierSG
      Tags: 
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-ec2-a"



  AppInstanceB:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !Ref AmazonLinuxAMI
      SubnetId: !Ref PrivateSubnetB
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref AppTierSG
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-app-ec2-b" 

# =========================================================
# OUTPUTS
# =========================================================
Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
 
  WebInstanceAPublicIP:
    Description: Public IP — Web EC2 A (open in browser)
    Value: !GetAtt WebInstanceA.PublicIp
 
  WebInstanceBPublicIP:
    Description: Public IP — Web EC2 B (open in browser)
    Value: !GetAtt WebInstanceB.PublicIp
 
  WebInstanceAId:
    Description: Instance ID — Web EC2 A (use for Session Manager)
    Value: !Ref WebInstanceA
 
  WebInstanceBId:
    Description: Instance ID — Web EC2 B (use for Session Manager)
    Value: !Ref WebInstanceB
 
  AppInstanceAId:
    Description: Instance ID — App EC2 A (use for Session Manager)
    Value: !Ref AppInstanceA
 
  AppInstanceBId:
    Description: Instance ID — App EC2 B (use for Session Manager)
    Value: !Ref AppInstanceB
 
  AppInstanceAPrivateIP:
    Description: Private IP — App EC2 A
    Value: !GetAtt AppInstanceA.PrivateIp
 
  AppInstanceBPrivateIP:
    Description: Private IP — App EC2 B
    Value: !GetAtt AppInstanceB.PrivateIp


