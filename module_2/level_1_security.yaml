AWSTemplateFormatVersion: "2010-09-09"
Description: "Tighten your IAM Permissions - Working Version"

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    Description: Environment name for resource tagging

Resources:
  # ======================
  # Security Group
  # ======================
  Level1SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for Level 1 Security Lab"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
          Description: "Allow HTTP traffic"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ======================
  # IAM Roles (No Custom Names)
  # ======================
  EC2S3ReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2S3ReadRole

  LambdaS3ReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName


  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName


  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  KeyAdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ======================
  # EC2 Instance
  # ======================
  MyEc2Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}"
      InstanceType: t3.micro
      IamInstanceProfile: !Ref EC2InstanceProfile
      SecurityGroupIds:
        - !Ref Level1SecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum update -y
          echo "Instance launched successfully" > /var/log/user-data.log
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ec2-instance"
        - Key: Environment
          Value: !Ref EnvironmentName

  # ======================
  # Lambda Function
  # ======================
  MyLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-lambda-function"
      Runtime: python3.12
      Role: !GetAtt LambdaS3ReadRole.Arn
      Handler: index.handler
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          import json
          def handler(event, context):
              return {
                  'statusCode': 200,
                  'body': json.dumps('Hello from Lambda!')
              }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ======================
  # KMS Key
  # ======================
  ProductionKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: "KMS Key for Parameter Store and Secrets Manager"
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: "kms:*"
            Resource: "*"
          - Sid: Allow use of the key
            Effect: Allow
            Principal:
              AWS:
                - !GetAtt KeyAdminRole.Arn
                - !GetAtt AppRole.Arn
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: "*"
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  ProductionKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-kms-key"
      TargetKeyId: !Ref ProductionKMSKey

  # ======================
  # SSM Parameter
  # ======================
  ProductionDatabaseKeyParams:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${AWS::StackName}/database/keys"
      Type: String
      Value: "initial-demo-value-change-me"
      Description: "Non-secret database metadata for production environment"
      Tags:
        Environment: !Ref EnvironmentName

  # ======================
  # Secrets Manager
  # ======================
  ProductionAppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}-app-secret"
      Description: "Application secrets for production"
      KmsKeyId: !Ref ProductionKMSKey
      SecretString: !Sub |
        {
          "MyPassword": "demo-password-change-me",
        }
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

Outputs:
  SecurityGroupId:
    Description: "ID of the security group"
    Value: !Ref Level1SecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-SecurityGroup"

  EC2InstanceId:
    Description: "ID of the EC2 instance"
    Value: !Ref MyEc2Instance
    Export:
      Name: !Sub "${AWS::StackName}-EC2Instance"

  LambdaFunctionArn:
    Description: "ARN of the Lambda function"
    Value: !GetAtt MyLambdaFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-LambdaFunction"

  KMSKeyId:
    Description: "ID of the KMS key"
    Value: !Ref ProductionKMSKey
    Export:
      Name: !Sub "${AWS::StackName}-KMSKey"
